<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="860" height="440" fill="#0d1117"/>
<text x="430" y="40" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Easy tasks converge. Hard tasks separate.</text>
<text x="430" y="64" text-anchor="middle" fill="#8b949e" font-size="13">pass-rate on named-file/easy tasks vs discovery/refactor/multi-file tasks</text>
<line x1="120" y1="110" x2="120" y2="360" stroke="#30363d"/>
<line x1="120" y1="360" x2="420" y2="360" stroke="#30363d"/>
<text x="270" y="90" text-anchor="middle" fill="#39d3bb" font-size="13" font-weight="600">EASY / named-file (7 tasks)</text>
<line x1="120" y1="360" x2="420" y2="360" stroke="#1c2128"/>
<text x="112" y="364" text-anchor="end" fill="#6e7681" font-size="10">0%</text>
<line x1="120" y1="235" x2="420" y2="235" stroke="#1c2128"/>
<text x="112" y="239" text-anchor="end" fill="#6e7681" font-size="10">50%</text>
<line x1="120" y1="110" x2="420" y2="110" stroke="#1c2128"/>
<text x="112" y="114" text-anchor="end" fill="#6e7681" font-size="10">100%</text>
<rect x="140" y="110" width="56" height="250" rx="4" fill="#58a6ff" opacity="0.9"/>
<text x="168" y="376" text-anchor="middle" fill="#8b949e" font-size="10">EmptyOS</text>
<text x="168" y="104" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">100%</text>
<rect x="210" y="110" width="56" height="250" rx="4" fill="#39d3bb" opacity="0.9"/>
<text x="238" y="376" text-anchor="middle" fill="#8b949e" font-size="10">goose</text>
<text x="238" y="104" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">100%</text>
<rect x="280" y="110" width="56" height="250" rx="4" fill="#f0883e" opacity="0.9"/>
<text x="308" y="376" text-anchor="middle" fill="#8b949e" font-size="10">aider*</text>
<text x="308" y="104" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">100%</text>
<rect x="350" y="110" width="56" height="250" rx="4" fill="#a5a5f5" opacity="0.9"/>
<text x="378" y="376" text-anchor="middle" fill="#8b949e" font-size="10">codex</text>
<text x="378" y="104" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">100%</text>
<line x1="480" y1="110" x2="480" y2="360" stroke="#30363d"/>
<line x1="480" y1="360" x2="780" y2="360" stroke="#30363d"/>
<text x="630" y="90" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="600">HARD / discovery + refactor (5 tasks)</text>
<line x1="480" y1="360" x2="780" y2="360" stroke="#1c2128"/>
<text x="472" y="364" text-anchor="end" fill="#6e7681" font-size="10">0%</text>
<line x1="480" y1="235" x2="780" y2="235" stroke="#1c2128"/>
<text x="472" y="239" text-anchor="end" fill="#6e7681" font-size="10">50%</text>
<line x1="480" y1="110" x2="780" y2="110" stroke="#1c2128"/>
<text x="472" y="114" text-anchor="end" fill="#6e7681" font-size="10">100%</text>
<rect x="500" y="110" width="56" height="250" rx="4" fill="#58a6ff" opacity="0.9"/>
<text x="528" y="376" text-anchor="middle" fill="#8b949e" font-size="10">EmptyOS</text>
<text x="528" y="104" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">5/5</text>
<rect x="570" y="160" width="56" height="200" rx="4" fill="#39d3bb" opacity="0.9"/>
<text x="598" y="376" text-anchor="middle" fill="#8b949e" font-size="10">goose</text>
<text x="598" y="154" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">4/5</text>
<rect x="640" y="332" width="56" height="28" rx="4" fill="#8b949e" opacity="0.16"/>
<text x="668" y="351" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="600">n/a</text>
<text x="668" y="376" text-anchor="middle" fill="#8b949e" font-size="10">aider*</text>
<rect x="710" y="310" width="56" height="50" rx="4" fill="#a5a5f5" opacity="0.9"/>
<text x="738" y="376" text-anchor="middle" fill="#8b949e" font-size="10">codex</text>
<text x="738" y="304" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">1/5</text>
<text x="430" y="418" text-anchor="middle" fill="#8b949e" font-size="11">*aider is a one-shot named-file editor — n/a on the discovery/refactor tasks (it timed out on the single multi-file delete it could attempt).</text>
</svg>