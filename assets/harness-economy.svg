<line x1="300" y1="129" x2="620" y2="129" stroke="#1c2128"/>
<text x="292" y="133" text-anchor="end" fill="#6e7681" font-size="11">100</text>
<text x="255" y="220" fill="#8b949e" font-size="12" transform="rotate(-90 255 220)" text-anchor="middle">iterations (model round-trips)</text>
<rect x="340" y="226" width="90" height="94" rx="5" fill="#58a6ff" opacity="0.92"/>
