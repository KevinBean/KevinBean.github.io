<text x="385" y="354" text-anchor="middle" fill="#39d3bb" font-size="12">8/8 passed</text>
<rect x="480" y="125" width="90" height="195" rx="5" fill="#f0883e" opacity="0.92"/>
<text x="525" y="117" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">102</text>
<text x="525" y="338" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Claude Code</text>
<text x="525" y="354" text-anchor="middle" fill="#39d3bb" font-size="12">8/8 passed</text>
<text x="430" y="372" text-anchor="middle" fill="#8b949e" font-size="12">Claude Code grinds ~2× the reasoning steps for the same result — insurance you cash on genuinely hard tasks, not everyday ones.</text>
