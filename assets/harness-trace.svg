<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" font-family="Inter, Segoe UI, system-ui, sans-serif">
<rect width="880" height="384" fill="#0d1117"/>
<defs>
<marker id="tar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
</defs>
<text x="440" y="40" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Same task. Three harnesses. Three outcomes.</text>
<text x="440" y="64" text-anchor="middle" fill="#8b949e" font-size="13">grep-and-replace — turn every <tspan font-family="monospace" fill="#c9d1d9">print("hello")</tspan> into <tspan font-family="monospace" fill="#c9d1d9">print("world")</tspan></text>
<circle cx="28" cy="143" r="6" fill="#58a6ff"/>
