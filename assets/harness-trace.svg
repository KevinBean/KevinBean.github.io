<text x="251" y="139" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="700">grep</text>
<text x="251" y="156" text-anchor="middle" fill="#8b949e" font-size="11">find the literal</text>
<line x1="329" y1="143" x2="349" y2="143" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<rect x="352" y="118" width="150" height="50" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="427" y="139" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="700">edit</text>
<text x="427" y="156" text-anchor="middle" fill="#8b949e" font-size="11">replace every match</text>
<line x1="505" y1="143" x2="525" y2="143" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<rect x="528" y="118" width="150" height="50" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="603" y="139" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="700">grep again</text>
<text x="603" y="156" text-anchor="middle" fill="#8b949e" font-size="11">0 left, verified</text>
<line x1="681" y1="143" x2="712" y2="143" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<circle cx="720" cy="143" r="16" fill="none" stroke="#39d3bb" stroke-width="2.4"/>
<path d="M713,143 l5,6 l10,-13" fill="none" stroke="#39d3bb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="746" y="140" fill="#39d3bb" font-size="14" font-weight="700">pass</text>
