<text x="44" y="238" fill="#e6edf3" font-size="15" font-weight="700">codex</text>
<rect x="176" y="208" width="150" height="50" rx="9" fill="#161b22" stroke="#b39dff" stroke-width="1.5"/>
<text x="251" y="229" text-anchor="middle" fill="#b39dff" font-size="13.5" font-weight="700">edit</text>
<text x="251" y="246" text-anchor="middle" fill="#8b949e" font-size="11">swapped a string</text>
<line x1="329" y1="233" x2="349" y2="233" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<rect x="352" y="208" width="150" height="50" rx="9" fill="#161b22" stroke="#b39dff" stroke-width="1.5"/>
<text x="427" y="229" text-anchor="middle" fill="#b39dff" font-size="13.5" font-weight="700">hello → goodbye</text>
<text x="427" y="246" text-anchor="middle" fill="#8b949e" font-size="11">copied a decoy file</text>
<line x1="505" y1="233" x2="536" y2="233" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<circle cx="720" cy="233" r="16" fill="none" stroke="#f85149" stroke-width="2.4"/>
