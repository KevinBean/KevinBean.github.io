<line x1="329" y1="323" x2="349" y2="323" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<rect x="352" y="298" width="150" height="50" rx="9" fill="#161b22" stroke="#39d3bb" stroke-width="1.5"/>
<text x="427" y="319" text-anchor="middle" fill="#39d3bb" font-size="13.5" font-weight="700">0 matches</text>
<text x="427" y="336" text-anchor="middle" fill="#8b949e" font-size="11">found nothing</text>
<line x1="505" y1="323" x2="525" y2="323" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<rect x="528" y="298" width="150" height="50" rx="9" fill="#161b22" stroke="#39d3bb" stroke-width="1.5"/>
<text x="603" y="319" text-anchor="middle" fill="#39d3bb" font-size="13.5" font-weight="700">no edit</text>
<text x="603" y="336" text-anchor="middle" fill="#8b949e" font-size="11">left it alone</text>
<line x1="681" y1="323" x2="712" y2="323" stroke="#8b949e" stroke-width="1.8" marker-end="url(#tar)"/>
<circle cx="720" cy="323" r="16" fill="none" stroke="#f85149" stroke-width="2.4"/>
<path d="M714,317 l12,12 M726,317 l-12,12" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
<text x="746" y="320" fill="#f85149" font-size="14" font-weight="700">fail</text>
<text x="746" y="337" fill="#8b949e" font-size="11">no change made</text>
<text x="440" y="362" text-anchor="middle" fill="#8b949e" font-size="12">Same model underneath all three. The difference is the loop — grep first, edit precisely, verify after.</text>
</svg>