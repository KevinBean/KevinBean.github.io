<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Plot frame -->
  <line x1="60" y1="340" x2="820" y2="340" stroke="#cccccc" stroke-width="1.2"/>
  <line x1="60" y1="80" x2="60" y2="340" stroke="#cccccc" stroke-width="1.2"/>

  <!-- X-axis label -->
  <text x="820" y="366" font-size="12" fill="#888" text-anchor="end">time →</text>

  <!-- Stage dividers (dashed) -->
  <line x1="270" y1="80" x2="270" y2="340" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="540" y1="80" x2="540" y2="340" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="4 4"/>

  <defs>
    <linearGradient id="systemFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d4aff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="depFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0344c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e0344c" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Stage labels — top -->
  <text x="165" y="40" font-size="14" fill="#222" text-anchor="middle" font-weight="600">Stage 1</text>
  <text x="165" y="58" font-size="12" fill="#666" text-anchor="middle">Use it</text>
  <text x="165" y="74" font-size="10.5" fill="#999" text-anchor="middle" font-style="italic">AI helps with tasks</text>

  <text x="405" y="40" font-size="14" fill="#222" text-anchor="middle" font-weight="600">Stage 2</text>
  <text x="405" y="58" font-size="12" fill="#666" text-anchor="middle">Abuse it</text>
  <text x="405" y="74" font-size="10.5" fill="#999" text-anchor="middle" font-style="italic">Build the system with AI</text>

  <text x="680" y="40" font-size="14" fill="#222" text-anchor="middle" font-weight="600">Stage 3</text>
  <text x="680" y="58" font-size="12" fill="#666" text-anchor="middle">Outlive it</text>
  <text x="680" y="74" font-size="10.5" fill="#999" text-anchor="middle" font-style="italic">Bounded, deliberate use</text>

  <!-- WHAT YOU'VE BUILT (purple, monotonic rise) -->
  <path d="M 60 322 C 130 318 200 312 270 298 C 320 282 380 215 460 145 C 520 110 600 95 680 88 C 720 86 760 85 790 84 L 790 340 L 60 340 Z"
        fill="url(#systemFill)"/>
  <path d="M 60 322 C 130 318 200 312 270 298 C 320 282 380 215 460 145 C 520 110 600 95 680 88 C 720 86 760 85 790 84"
        fill="none" stroke="#6d4aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CODING-AGENT DEPENDENCY (red, arc) -->
  <path d="M 60 312 C 130 308 200 302 270 290 C 310 275 350 200 420 150 C 460 138 500 142 540 175 C 580 222 630 262 700 282 C 740 290 770 293 790 295 L 790 340 L 60 340 Z"
        fill="url(#depFill)"/>
  <path d="M 60 312 C 130 308 200 302 270 290 C 310 275 350 200 420 150 C 460 138 500 142 540 175 C 580 222 630 262 700 282 C 740 290 770 293 790 295"
        fill="none" stroke="#e0344c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inline line labels at the right end (inside viewBox) -->
  <circle cx="790" cy="84" r="3.2" fill="#6d4aff"/>
  <text x="800" y="88" font-size="11.5" fill="#6d4aff" font-weight="600">What you've built</text>
  <text x="800" y="102" font-size="10" fill="#888">keeps growing</text>

  <circle cx="790" cy="295" r="3.2" fill="#e0344c"/>
  <text x="800" y="285" font-size="11.5" fill="#e0344c" font-weight="600">Coding-agent dependency</text>
  <text x="800" y="299" font-size="10" fill="#888">bounded, not zero</text>

  <!-- The "gap" annotation between the two lines at right side -->
  <g>
    <line x1="755" y1="86" x2="755" y2="293" stroke="#888" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="751" y1="86" x2="759" y2="86" stroke="#888" stroke-width="1"/>
    <line x1="751" y1="293" x2="759" y2="293" stroke="#888" stroke-width="1"/>
    <text x="745" y="186" font-size="11" fill="#444" text-anchor="end" font-weight="600">the gap</text>
    <text x="745" y="200" font-size="10" fill="#777" text-anchor="end">is the thesis</text>
  </g>

  <!-- Peak callout — kept lightweight, placed clear of stage labels -->
  <g>
    <text x="430" y="135" font-size="10.5" fill="#888" text-anchor="start" font-style="italic">“what am I even good for in this?”</text>
    <line x1="425" y1="138" x2="418" y2="148" stroke="#bbb" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- Bottom x-axis annotations -->
  <text x="165" y="362" font-size="10.5" fill="#aaa" text-anchor="middle">individual tasks</text>
  <text x="405" y="362" font-size="10.5" fill="#aaa" text-anchor="middle">intensive building</text>
  <text x="680" y="362" font-size="10.5" fill="#aaa" text-anchor="middle">maintenance + selective use</text>
</svg>
